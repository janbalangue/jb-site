spring.application.name=jb-site
server.port=8080
server.address=0.0.0.0
spring.thymeleaf.cache=true
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.aot.enabled=false

# Expose only health endpoint
management.endpoints.web.exposure.include=health

# Enable liveness/readiness (important for Fly)
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

## Site-wide stats (used by Thymeleaf templates + HTMX fragments)
site.stats.soundcloudFollowers=1.3K
site.stats.substackSubscribers=320
site.stats.substackFollowers=1.5K
site.stats.substackSince=Oct 2025
site.stats.youtubeSubscribers=5.2K
site.stats.youtubeSince=Dec 2025
site.stats.bulkheadVersion=v0.5.2
site.stats.tsBulkheadVersion=v0.2.3